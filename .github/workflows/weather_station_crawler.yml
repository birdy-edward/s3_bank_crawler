name: Weather Crawler

on:
    schedule:
        - cron: '0 0 * * *' # Runs every day at midnight
    workflow_dispatch:
        inputs:
            output_path:
                description: The target folder for the output files
                type: string
                required: true
                default: "./data/weather"



env:
    OUTPUT_PATH: ${{ github.event.inputs.output_path }}

jobs:
    setup:
        name: Crawl Weather Data
        runs-on: ubuntu-latest
        outputs:
            TRIGGER: ${{ steps.find_files.outputs.TRIGGER }}
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
            
            - name: Find files
              id: find_files
              run: |
                if [ -f main.py ]; then
                    echo "File exists."
                    echo "TRIGGER=True" >> $GITHUB_OUTPUT
                else
                    echo "TRIGGER=False" >> $GITHUB_OUTPUT
                fi

    crawl:
        name: Collect Weather Data       
        runs-on: ubuntu-latest
        needs: setup
        if: needs.setup.outputs.TRIGGER == 'True'
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                ref: 'main'
                token: ${{ secrets.GITHUB_TOKEN }}
            
            - name: Setup Python
              uses: actions/setup-python@v4
              with:
                python-version: '3.12'
            
            - name: Install dependencies
              run: |
                python -m pip install --upgrade pip
                pip install -r requirements.txt
            
            - name: Get current date
              run: |
                CURRENT_DATE=$(date)
                if [ -d "${{ env.OUTPUT_PATH }}" ]; then
                    echo "Directory exists."
                else
                    echo "Directory does not exist. Creating directory..."
                    mkdir -p ${{ env.OUTPUT_PATH }}
                fi

            - name: Set up Git
              run: |
                git config --global user.name "${{ vars.name }}"
                git config --global user.email "${{ vars.email }}"
                git checkout -b upload_weather_date_$CURRENT_DATE
            
            - name: Collecting data           
              run: |
                echo "Collecting data..."
                python ./main.py --output_path ${{ env.OUTPUT_PATH }} --event "station"
                sleep 20
                git checkout main
                git add ./data
                git commit -m "CRAWLING $CURRENT_DATE: Up-to-date weather data..."
                git push --set-upstream origin upload_weather_date_$CURRENT_DATE


