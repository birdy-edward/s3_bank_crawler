name: Weather Crawler

on:
    schedule:
        - cron: '0 0 * * *' # Runs every day at midnight
    workflow_dispatch:
        inputs:
            output_path:
                description: The target folder for the output files
                type: string
                required: true
                default: "./data/weather"
jobs:
    setup:
        name: Crawl Weather Data
        runs-on: ubuntu-latest
        env:
            OUTPUT_PATH: ${{ github.event.inputs.output_path }}
        outputs:
            TRIGGER: ${{ steps.find_files.outputs.TRIGGER }}
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
            
            - name: Find files
              id: find_files
              run: |
                if [ -e "${{ env.OUTPUT_PATH }}" ]; then
                    echo "Directory exists."
                else
                    echo "Directory does not exist. Creating directory..."
                    mkdir -p ${{ env.OUTPUT_PATH }}
                fi

                if [ -f ./main.py ]; then
                    echo "File does not exists."
                else
                    echo "TRIGGER=True" >> $GITHUB_OUTPUT
    crawl:
        name: Collect Weather Data       
        runs-on: ubuntu-latest
        needs: setup
        if: needs.setup.outputs.TRIGGER == 'True'
        env:
            OUTPUT_PATH: ${{ github.event.inputs.output_path }}
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
            
            - name: Setup Python
              uses: actions/setup-python@v4
              with:
                python-version: '3.12'
            
            - name: Install dependencies
              run: |
                python -m pip install --upgrade pip
                pip install -r requirements.txt
            
            - name: Get current date
              run: CURRENT_DATE=$(date)


