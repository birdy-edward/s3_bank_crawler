name: Weather Crawler

on:
    schedule:
        - cron: '0 0 * * *' # Runs every day at midnight
    workflow_dispatch:
        inputs:
            output_path:
                description: The target folder for the output files
                type: string
                required: true
                default: "./data/weather"
jobs:
    crawl:
        runs-on: ubuntu-latest
        env:
            OUTPUT_PATH: ${{ github.event.inputs.output_path }}
            GHE_TOKEN: ${{ secrets.GHE_TOKEN }}
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
            
            - name: Setup Python
              uses: actions/setup-python@v4
              with:
                python-version: '3.12'
            
            - name: Install dependencies
              run: |
                python -m pip install --upgrade pip
                pip install -r requirements.txt
            
            - name: Get current date
              run: CURRENT_DATE=$(date)
            
            - name: Collecting data
              run: |
                echo "Collecting data..."
                python crawler/crawler.py --output_path ${{ env.OUTPUT_PATH }} --event "station"
                git checkout main
                git add ./data
                git commit -m "CRAWLING $CURRENT_DATE: Up-to-date weather data..."
                git push origin main


