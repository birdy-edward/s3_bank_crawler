name: AWS S3 Uploading

on:
    workflow_dispatch:
      inputs:
        environment:
          description: The target AWS account
          type: choice
          required: true
          default: 'nonprod'
          options:
            - nonprod
            - prod
jobs:
    deploy:
      runs-on: ubuntu-latest
      steps:
        - name: Checkout code
          uses: actions/checkout@v4
        
        - name: Setup Python
          uses: actions/setup-python@v4
          with:
            python-version: '3.12'
        
        - name: Install dependencies
          run: |
            python -m pip install --upgrade pip
            pip install -r requirements.txt
        
        - name: Collecting data
          run: |
            echo "Collecting data..."
            python ./main.py --output_path ./output --event "bank"
        

