name : Deploy AWS Infrastructure

on:
    workflow_dispatch:
        inputs:
            environment:
                description: The target AWS account
                type: choice
                required: true
                default: 'nonprod'
                options:
                - nonprod
                - prod

jobs:
    deploy:
        runs-on: ubuntu-latest
        environment: ${{ inputs.environment }}
        env:
            AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
            AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
            AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
            AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
            TF_VAR_gha_setup_file: "./gha/setup_gha.sh"
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
            
            - name: Setup Python
              uses: actions/setup-python@v4
              with:
                  python-version: '3.12'
            
            - name: Setup AWS
              run: |
                pip install --upgrade awscli
                aws --version
            
            - name: Get Github Runner Script
              run: |
                echo "${{ secrets.GHA_RUNNER }}" > ./gha/setup_gha.sh

            - name: Setup Terraform
              uses: hashicorp/setup-terraform@v2
              with:
                terraform_version: '1.4.0'
                
            - name: Terraform Installation
              run: |
                terraform init \
                  -backend-config="bucket=${{ github.event.repository.name }}-${{ inputs.environment }}"\
                  -backend-config="key=terraform.tfstate"
                  -backend-config="region=${{ secrets.AWS_DEFAULT_REGION }}"
            
            - name: Terraform Plan
              run: terraform plan
            
            - name: Terraform Apply
              run: terraform apply -auto-approve